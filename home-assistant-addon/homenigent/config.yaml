name: Homenigent
slug: homenigent
version: "0.1.0"
description: Private Omnigent family-chat server backed by persistent SQLite storage.
url: https://github.com/amiru3f/homenigent
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:robot-outline
map:
  - data:rw
options:
  openrouter_api_key: ""
  accounts_cookie_secret: ""
  init_admin_password: ""
schema:
  openrouter_api_key: password
  accounts_cookie_secret: password
  init_admin_password: password?
